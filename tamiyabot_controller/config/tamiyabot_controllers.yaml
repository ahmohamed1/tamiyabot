controller_manager:
  ros__parameters:
    update_rate: 30 # Hz
    # use_sim_time: true

    tamiyabot_controller:
      type: bicycle_steering_controller/BicycleSteeringController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

joint_state_broadcaster:
  ros__parameters:
    extra_joints: ["front_left_wheel_joint", "front_right_wheel_joint"]

tamiyabot_controller:
  ros__parameters:
      use_sim_time: true
      type: 'bicycle_steering_controller/BicycleSteeringController'
      wheelbase: 0.28
      front_wheel_track: 0.14
      rear_wheel_track: 0.14
      front_wheel_radius: 0.0415
      rear_wheel_radius: 0.0415
      front_steering: true
      reference_timeout: 2.0
      rear_wheels_names: ["virtual_rear_wheel_joint"]
      front_wheels_names: ["virtual_front_wheel_joint"]
      open_loop: false
      velocity_rolling_window_size: 10
      base_frame_id: base_link
      odom_frame_id: odom
      enable_odom_tf: true
      position_feedback: false
      use_stamped_vel: true
